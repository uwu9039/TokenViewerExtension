# TokenViewerExtension — 自动构建与 GitHub Release 工作流
#
# 触发方式：
#   1. 推送 v* 标签（如 v0.0.3）→ 构建 x64/arm64 的 MSIX 与 EXE 安装器，自动创建 Release
#   2. 手动运行（Actions → 本工作流 → Run workflow）→ 仅构建并上传产物
#
# 产物：
#   - MSIX（Store / 侧载分发用）
#   - EXE 安装器（WinGet 分发用，未打包注册扩展）

name: 构建并发布

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        platform: [x64, arm64]
    runs-on: windows-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: 安装 Inno Setup
        run: choco install innosetup -y --no-progress

      - name: 构建 MSIX（${{ matrix.platform }}）
        working-directory: TokenViewerExtension
        run: dotnet build --configuration Release -p:GenerateAppxPackageOnBuild=true -p:Platform=${{ matrix.platform }} -p:AppxPackageDir="AppPackages\${{ matrix.platform }}\"

      - name: 构建 EXE 安装器（${{ matrix.platform }}）
        working-directory: TokenViewerExtension
        shell: pwsh
        run: .\build-exe.ps1 -Platforms @("${{ matrix.platform }}")

      - name: 收集产物
        working-directory: TokenViewerExtension
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "..\dist" | Out-Null
          Get-ChildItem -Path "AppPackages\${{ matrix.platform }}" -Recurse -Filter "*.msix" | Copy-Item -Destination "..\dist\"
          Copy-Item "bin\Release\installer\*.exe" "..\dist\"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: 下载全部产物
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* --generate-notes --repo "${{ github.repository }}"
